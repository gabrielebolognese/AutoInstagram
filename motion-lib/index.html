<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>paper-cards motion library: the showreel</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <!-- The showreel root, generated by `bash pipeline/bin/gallery` from catalog.json: every component once with its
         demo props, in a row over the paper canvas (88 s). `npx hyperframes check` and `snapshot --composition <id>`
         run on this file; the human gallery is gallery/index.html. Do not edit by hand: change catalog.py META or the
         component and run the gallery again. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="88" data-width="1080" data-height="1920">
      <div id="paper-canvas" class="clip" data-composition-id="paper-canvas" data-composition-src="compositions/paper-canvas.html" data-start="0" data-duration="88" data-track-index="0" data-width="1080" data-height="1920" style="z-index: 0" data-variable-values='{"seed": 7, "duration": 89.0}'></div>
      <div id="card" class="clip" data-composition-id="card" data-composition-src="compositions/card.html" data-start="0" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="card" style="z-index: 2" data-variable-values='{"mascot": "star", "exit": "fade-blur", "exit_at": 2.6}'></div>
      <div id="stat-number" class="clip" data-composition-id="stat-number" data-composition-src="compositions/stat-number.html" data-start="3" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="stat-number" style="z-index: 2" data-variable-values='{"icon": "download"}'></div>
      <div id="end-card" class="clip" data-composition-id="end-card" data-composition-src="compositions/end-card.html" data-start="6" data-duration="5" data-track-index="1" data-width="1080" data-height="1920" data-scene="end-card" style="z-index: 2" data-variable-values='{"lockup": "assets/brand/lockup/lockup-gradient-on-light.png"}'></div>
      <div id="mascot" class="clip" data-composition-id="mascot" data-composition-src="compositions/mascot.html" data-start="11" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="mascot" style="z-index: 3" data-variable-values='{"x": 500, "y": 900, "scale": 3, "move": "hop", "enter_at": 0.3}'></div>
      <div id="dark-chip" class="clip" data-composition-id="dark-chip" data-composition-src="compositions/dark-chip.html" data-start="14" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="dark-chip" style="z-index: 3" data-variable-values='{"icon": "clock", "enter_at": 0.3}'></div>
      <div id="light-chip" class="clip" data-composition-id="light-chip" data-composition-src="compositions/light-chip.html" data-start="17" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="light-chip" style="z-index: 3" data-variable-values='{"enter_at": 0.3}'></div>
      <div id="caption-line" class="clip" data-composition-id="caption-line" data-composition-src="compositions/caption-line.html" data-start="20" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="caption-line" style="z-index: 5"></div>
      <div id="pop" class="clip" data-composition-id="pop" data-composition-src="compositions/pop.html" data-start="23" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="pop" style="z-index: 3" data-variable-values='{"kind": "tile", "icon": "bolt", "overshoot": 0.13, "frames": 14, "enter_at": 0.3}'></div>
      <div id="check-badge" class="clip" data-composition-id="check-badge" data-composition-src="compositions/check-badge.html" data-start="26" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="check-badge" style="z-index: 3" data-variable-values='{"size": 120, "x": 480, "enter_at": 0.3}'></div>
      <div id="window-card" class="clip" data-composition-id="window-card" data-composition-src="compositions/window-card.html" data-start="29" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="window-card" style="z-index: 2" data-variable-values='{"image": "assets/demo/plugin-page.png", "mascot": "play", "honesty": "sourced"}'></div>
      <div id="terminal-card" class="clip" data-composition-id="terminal-card" data-composition-src="compositions/terminal-card.html" data-start="32" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" data-scene="terminal-card" style="z-index: 2"></div>
      <div id="chart-card" class="clip" data-composition-id="chart-card" data-composition-src="compositions/chart-card.html" data-start="36" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="chart-card" style="z-index: 2"></div>
      <div id="thumb-grid" class="clip" data-composition-id="thumb-grid" data-composition-src="compositions/thumb-grid.html" data-start="39" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="thumb-grid" style="z-index: 2"></div>
      <div id="logo-tile" class="clip" data-composition-id="logo-tile" data-composition-src="compositions/logo-tile.html" data-start="42" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="logo-tile" style="z-index: 3" data-variable-values='{"image": "assets/brand/mark/mark-gradient.png", "second_image": "assets/brand/mark/mark-black.png", "x": 366, "enter_at": 0.2}'></div>
      <div id="strike-through" class="clip" data-composition-id="strike-through" data-composition-src="compositions/strike-through.html" data-start="45" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="strike-through" style="z-index: 3"></div>
      <div id="fly-in" class="clip" data-composition-id="fly-in" data-composition-src="compositions/fly-in.html" data-start="48" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="fly-in" style="z-index: 2" data-variable-values='{"mascot": "film", "enter_at": 0.2}'></div>
      <div id="chat-card" class="clip" data-composition-id="chat-card" data-composition-src="compositions/chat-card.html" data-start="51" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" data-scene="chat-card" style="z-index: 2"></div>
      <div id="progress-bar" class="clip" data-composition-id="progress-bar" data-composition-src="compositions/progress-bar.html" data-start="55" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="progress-bar" style="z-index: 3"></div>
      <div id="camera-move" class="clip" data-composition-id="camera-move" data-composition-src="compositions/camera-move.html" data-start="58" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="camera-move" style="z-index: 2" data-variable-values='{"image": "assets/demo/repo.png"}'></div>
      <div id="headline" class="clip" data-composition-id="headline" data-composition-src="compositions/headline.html" data-start="61" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" data-scene="headline" style="z-index: 2" data-variable-values='{"kicker_mark": "assets/brand/mark/mark-gradient.png"}'></div>
      <div id="exit-move" class="clip" data-composition-id="exit-move" data-composition-src="compositions/exit-move.html" data-start="65" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="exit-move" style="z-index: 2"></div>
      <div id="handwritten-callout" class="clip" data-composition-id="handwritten-callout" data-composition-src="compositions/handwritten-callout.html" data-start="68" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="handwritten-callout" style="z-index: 3" data-variable-values='{"enter_at": 0.3}'></div>
      <div id="speech-bubble" class="clip" data-composition-id="speech-bubble" data-composition-src="compositions/speech-bubble.html" data-start="71" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="speech-bubble" style="z-index: 3" data-variable-values='{"keyword": "TELLS", "enter_at": 0.3}'></div>
      <div id="table-card" class="clip" data-composition-id="table-card" data-composition-src="compositions/table-card.html" data-start="74" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="table-card" style="z-index: 2"></div>
      <div id="dm-card" class="clip" data-composition-id="dm-card" data-composition-src="compositions/dm-card.html" data-start="77" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" data-scene="dm-card" style="z-index: 3" data-variable-values='{"avatar": "assets/brand/mark/avatar-dark.png", "y": 700, "enter_at": 0.3}'></div>
      <div id="hero-3d" class="clip" data-composition-id="hero-3d" data-composition-src="compositions/hero-3d.html" data-start="80" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" data-scene="hero-3d" style="z-index: 2" data-variable-values='{"label": "the skill file", "enter_at": 0.2, "clip_start": 80.0}'></div>
      <div id="icon-3d" class="clip" data-composition-id="icon-3d" data-composition-src="compositions/icon-3d.html" data-start="84" data-duration="4" data-track-index="1" data-width="1080" data-height="1920" data-scene="icon-3d" style="z-index: 2" data-variable-values='{"icon": "bolt", "enter_at": 0.2}'></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
