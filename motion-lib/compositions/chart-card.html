<html data-composition-variables='[
  {"id":"x","type":"number","label":"Left (px)","default":90},
  {"id":"y","type":"number","label":"Top (px)","default":520},
  {"id":"w","type":"number","label":"Width (px)","default":900},
  {"id":"h","type":"number","label":"Height (px)","default":620},
  {"id":"title","type":"string","label":"Title","default":"Installs per month"},
  {"id":"kind","type":"enum","label":"Bars or gauge","default":"bars","options":[{"value":"bars","label":"bars"},{"value":"gauge","label":"gauge"}]},
  {"id":"values_json","type":"string","label":"Bars as JSON: [{\"label\":\"Jan\",\"value\":12,\"highlight\":false}]","default":"[{\"label\":\"Aug\",\"value\":41},{\"label\":\"Sep\",\"value\":58},{\"label\":\"Oct\",\"value\":77},{\"label\":\"Nov\",\"value\":100,\"highlight\":true}]"},
  {"id":"max","type":"number","label":"Scale maximum (0 = the largest value)","default":0},
  {"id":"unit","type":"string","label":"Unit after the values","default":"%"},
  {"id":"gauge_value","type":"number","label":"Gauge value (0 to 100)","default":72},
  {"id":"bar_frames","type":"number","label":"Bar growth frames","default":12},
  {"id":"bar_gap_frames","type":"number","label":"Frames between bars","default":2},
  {"id":"value_fade_frames","type":"number","label":"Value label fade frames","default":2},
  {"id":"gauge_frames","type":"number","label":"Gauge frames","default":23},
  {"id":"enter_at","type":"number","label":"Enter at (s)","default":0},
  {"id":"honesty","type":"enum","label":"Honesty label","default":"mock","options":[{"value":"none","label":"none"},{"value":"mock","label":"mock"},{"value":"sourced","label":"sourced"}]},
  {"id":"hold","type":"enum","label":"Hold level (the steady motion after the entrance)","default":"normal","options":[{"value":"calm","label":"calm"},{"value":"normal","label":"normal"},{"value":"lively","label":"lively"}]},
  {"id":"exit","type":"enum","label":"Exit","default":"none","options":[{"value":"none","label":"none"},{"value":"fade-blur","label":"fade-blur"},{"value":"fall","label":"fall"},{"value":"push","label":"push"},{"value":"cut","label":"cut"}]},
  {"id":"exit_at","type":"number","label":"Exit at (s, -1 = never)","default":-1}
]'>
<template>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* chart-card (vocabulary.md 12): data as bars or a gauge. Bars grow over 12 frames, ease-out, 2 frames apart, left to
       right; the value fades in over 2 frames as its bar ends (v06); the gauge arc grows with its number over 23 frames
       (v04). The highlight bar is accent, the rest ink at low opacity. Data that is not real carries the honesty label.
       The card lives through E1's phases with E2's combined entrance; title, bars and gauge sit at their own depths (E6). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #cc { padding: 40px 46px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px; }
    #cc-title { font-weight: 800; font-size: 36px; letter-spacing: -0.02em; }
    #cc-bars { flex: 1 1 auto; display: flex; align-items: flex-end; gap: 28px; padding: 44px 0 46px; position: relative; box-sizing: border-box; }
    .cc-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
    .cc-bar { width: 100%; border-radius: 16px 16px 8px 8px; background: var(--c-ink); opacity: 0.18; transform-origin: 50% 100%; }
    .cc-bar.hi { background: var(--c-accent); opacity: 1; }
    .cc-value { position: absolute; font-weight: 800; font-size: 30px; transform: translateY(-100%); margin-top: -10px; }
    .cc-label { position: absolute; bottom: -42px; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 28px; opacity: 0.6; letter-spacing: 0.04em; }
    #cc-gauge { flex: 1 1 auto; display: none; align-items: center; justify-content: center; position: relative; }
    #cc-gauge svg { width: 440px; height: 260px; }
    #cc-gauge-num { position: absolute; bottom: 24px; font-weight: 800; font-size: 72px; letter-spacing: -0.02em; }
  </style>
  <div id="root" data-composition-id="chart-card" data-width="1080" data-height="1920">
    <div id="cc" class="pc-card pc-el">
      <div id="cc-title"></div>
      <div id="cc-bars"></div>
      <div id="cc-gauge"><svg viewBox="0 0 440 260"><path id="cc-track" d="M40 230 A180 180 0 0 1 400 230" fill="none" stroke="#100904" stroke-opacity="0.12" stroke-width="34" stroke-linecap="round"/><path id="cc-arc" d="M40 230 A180 180 0 0 1 400 230" fill="none" stroke="#DC6532" stroke-width="34" stroke-linecap="round"/></svg><div id="cc-gauge-num">0</div></div>
    </div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 90, y: 520, w: 900, h: 620, title: "", kind: "bars", values_json: [], max: 0, unit: "", gauge_value: 72, bar_frames: 12, bar_gap_frames: 2,
        value_fade_frames: 2, gauge_frames: 23, enter_at: 0, honesty: "mock", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var cc = document.getElementById("cc"), bars = document.getElementById("cc-bars"), gauge = document.getElementById("cc-gauge"), title = document.getElementById("cc-title");
      PC.place(cc, v);
      title.textContent = v.title;
      PC.honesty(cc, v.honesty, { top: 18, right: 24 });
      PCM.depth(cc, [title]);  // the bars stay in the card's plane: a bar growing from nothing measures cleanly there
      var tl = gsap.timeline({ paused: true });
      var life = PCM.life(tl, cc, { at: v.enter_at, main: { kind: "rise", rise: 38 }, hold: v.hold, exit: { type: v.exit, at: v.exit_at } });
      var landAt = life.land;
      var quiet = { move: 0, scale: 0, rotate: 0 };
      if (v.kind === "gauge") {
        bars.style.display = "none"; gauge.style.display = "flex";
        var arc = document.getElementById("cc-arc"), num = document.getElementById("cc-gauge-num");
        var len = arc.getTotalLength();
        var pct = Math.max(0, Math.min(100, v.gauge_value)) / 100;
        PCM.draw(tl, arc, landAt, { length: len, frames: v.gauge_frames, to: len * (1 - pct), ease: "power2.out" });
        PCM.countUp(tl, num, landAt, { to: v.gauge_value, frames: v.gauge_frames, suffix: v.unit, ease: "power2.out" });
        PC.event("gauge", landAt, { el: "cc-arc", end: landAt + PC.f(v.gauge_frames) });
      } else {
        var values = Array.isArray(v.values_json) ? v.values_json : [];
        var max = v.max > 0 ? v.max : values.reduce(function (m, d) { return Math.max(m, Number(d.value) || 0); }, 0) || 1;
        values.forEach(function (d, i) {
          var col = PC.el("div", "cc-col", bars);
          var val = PC.el("div", "cc-value", col, PC.fmt(d.value, 0) + (v.unit || "")); val.id = "cc-val-" + i;
          var bar = PC.el("div", "cc-bar" + (d.highlight ? " hi" : ""), col); bar.id = "cc-bar-" + i;
          bar.style.height = Math.max(4, (Number(d.value) || 0) / max * 100) + "%";
          PC.el("div", "cc-label", col, d.label || "");
          var at = landAt + PC.f(v.bar_gap_frames) * i;
          PCM.grow(tl, bar, at, { frames: v.bar_frames, axis: "y", event: "bar" });
          var vat = at + PC.f(v.bar_frames) - PC.f(v.value_fade_frames);
          PCM.life(tl, val, { at: vat, main: { kind: "fade", frames: v.value_fade_frames, rise: 0, zoom: false, rotate: false }, hold: { kind: "none" }, inertia: quiet, until: vat + PC.f(1), events: { enter: "value" } });
          val.style.bottom = bar.style.height;
        });
      }
      window.__timelines["chart-card"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
</html>
