<html data-composition-variables='[
  {"id":"x","type":"number","label":"Left (px)","default":90},
  {"id":"y","type":"number","label":"Top (px)","default":480},
  {"id":"w","type":"number","label":"Width (px)","default":900},
  {"id":"h","type":"number","label":"Height (px, 0 = auto)","default":0},
  {"id":"from","type":"enum","label":"Parked spot","default":"bottom","options":[{"value":"bottom","label":"below the frame"},{"value":"half-bottom","label":"half off the bottom"},{"value":"left","label":"off the left edge"},{"value":"right","label":"off the right edge"}]},
  {"id":"distance","type":"number","label":"Travel distance (px, 414 to 930)","default":930},
  {"id":"frames","type":"number","label":"Frames (11 to 16)","default":14},
  {"id":"tilt","type":"number","label":"Start tilt (degrees, 2.4 to 3.9)","default":3.9},
  {"id":"end_tilt","type":"number","label":"End tilt (degrees, 0 to 1.4)","default":0},
  {"id":"title","type":"string","label":"Title","default":"The frontend-design skill"},
  {"id":"body","type":"string","label":"Body text","default":"Plans 4 to 6 hex colors, reviews the layout, then codes."},
  {"id":"image","type":"string","label":"Image (assets/..., optional)","default":""},
  {"id":"image_h","type":"number","label":"Image height (px)","default":520},
  {"id":"enter_at","type":"number","label":"Fly in at (s)","default":0},
  {"id":"mascot","type":"string","label":"Mascot prop on the top-right corner (empty = none)","default":""},
  {"id":"hold","type":"enum","label":"Hold level (the steady motion after the landing)","default":"normal","options":[{"value":"calm","label":"calm"},{"value":"normal","label":"normal"},{"value":"lively","label":"lively"}]},
  {"id":"exit","type":"enum","label":"Exit","default":"none","options":[{"value":"none","label":"none"},{"value":"fade-blur","label":"fade-blur"},{"value":"fall","label":"fall"},{"value":"push","label":"push"},{"value":"cut","label":"cut"}]},
  {"id":"exit_at","type":"number","label":"Exit at (s, -1 = never)","default":-1}
]'>
<template>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* fly-in (vocabulary.md 16, Fly-in from a parked spot): a big entrance for a hero card or window: travels 414 to
       930 px over 11 to 16 frames, expo-out (each frame's step 0.64 to 0.69 of the previous), the start tilt of 2.4 to
       3.9 degrees easing to 0 (hero cards straight: open question 10, v02), no overshoot. E2 adds the zoom from a close
       start and the parallax rotation; then the inertia and the hold of E1 (pc-motion.js). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #fi { padding: 48px 52px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; }
    #fi-image { width: 100%; overflow: hidden; border-radius: 18px; display: none; background: var(--c-surface-chrome); }
    #fi-image img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    #fi-mascot { position: absolute; display: none; }
  </style>
  <div id="root" data-composition-id="fly-in" data-width="1080" data-height="1920">
    <div id="fi" class="pc-card pc-el">
      <div id="fi-image"><img id="fi-img" alt=""></div>
      <div id="fi-title" class="pc-title"></div>
      <div id="fi-body" class="pc-body"></div>
    </div>
    <div id="fi-mascot" class="pc-mascot pc-el"></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 90, y: 480, w: 900, h: 0, from: "bottom", distance: 930, frames: 14, tilt: 3.9, end_tilt: 0, title: "", body: "", image: "", image_h: 520,
        enter_at: 0, mascot: "", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var card = document.getElementById("fi");
      PC.place(card, v);
      var parts = [];
      var t = document.getElementById("fi-title"), b = document.getElementById("fi-body");
      if (v.title) { t.textContent = v.title; parts.push(t); } else t.style.display = "none";
      if (v.body) { b.textContent = v.body; parts.push(b); } else b.style.display = "none";
      if (v.image) { document.getElementById("fi-img").src = v.image; var w = document.getElementById("fi-image"); w.style.height = v.image_h + "px"; w.style.display = "block"; parts.unshift(w); }
      PCM.depth(card, parts);
      var dx = 0, dy = 0;
      if (v.from === "bottom") dy = v.distance; else if (v.from === "half-bottom") dy = Math.round(v.distance / 2);
      else if (v.from === "left") dx = -v.distance; else dx = v.distance;
      var tl = gsap.timeline({ paused: true });
      var exit = { type: v.exit, at: v.exit_at };
      var life = PCM.life(tl, card, { at: v.enter_at, main: { kind: "fly-in", dx: dx, dy: dy, tilt: v.tilt, endTilt: v.end_tilt, frames: v.frames, axis: dx ? "y" : "x" }, hold: v.hold, exit: exit });
      if (v.mascot) {
        var m = document.getElementById("fi-mascot");
        m.innerHTML = PC.mascotSVG(v.mascot, getComputedStyle(document.documentElement).getPropertyValue("--c-mascot").trim());
        m.style.display = "block"; m.style.left = (v.x + v.w - 47) + "px"; m.style.top = (v.y - 32) + "px";
        PCM.mascotEnter(tl, m, life.land, { hold: v.hold, exit: exit, until: life.until, seed: PC.hash(v.title + v.mascot) });
      }
      window.__timelines["fly-in"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
</html>
