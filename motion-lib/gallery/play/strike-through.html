<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 120, "y": 820, "text": "video AI", "style": "line", "chip": true, "font_px": 48, "replacement": "motion graphics", "enter_at": 0, "strike_at": 0.5, "line_frames": 4, "x_frames": 6, "x_gap_frames": 6, "replace_frames_per_char": 2, "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* strike-through (vocabulary.md 15): "not X", before and after. A line drawn across over 4 frames (v04), or an X as
       two strokes of 6 frames each, 6 frames apart (v06); a replacement types in after it (v04). The strike is the
       negative sound event. The group lives through E1's phases (pc-motion.js); the line and the typing are the
       style's measured moves. */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #st-wrap { display: inline-flex; align-items: center; gap: 22px; }
    #st-text { position: relative; display: inline-block; font-weight: 800; }
    #st-text.chip { height: var(--light-chip-h); padding: 0 28px; border-radius: 999px; background: var(--c-surface); box-shadow: 0 0 0 var(--card-edge) var(--c-card-edge), 0 14px 22px -6px rgba(133, 112, 92, 0.28); font-size: 30px; font-weight: 700; display: inline-flex; align-items: center; }
    .st-line { position: absolute; left: -6%; width: 112%; height: 7px; border-radius: 4px; background: var(--c-accent); top: 50%; margin-top: -3px; transform-origin: 0% 50%; }
    .st-line.b { transform: rotate(0deg); }
    .st-x1 { transform: rotate(-18deg); } .st-x2 { transform: rotate(18deg); }
    #st-replacement { font-weight: 800; color: var(--c-accent-deep); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="strike-through" data-width="1080" data-height="1920">
    <div id="st-wrap" class="pc-el">
      <span id="st-text"><span id="st-label"></span></span>
      <span id="st-replacement"></span>
    </div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 120, y: 820, text: "video AI", style: "line", chip: true, font_px: 48, replacement: "", enter_at: 0, strike_at: 0.5, line_frames: 4, x_frames: 6,
        x_gap_frames: 6, replace_frames_per_char: 2, hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var wrap = document.getElementById("st-wrap"), text = document.getElementById("st-text"), rep = document.getElementById("st-replacement");
      PC.place(wrap, { x: v.x, y: v.y });
      document.getElementById("st-label").textContent = v.text;
      if (v.chip) text.classList.add("chip"); else { text.style.fontSize = v.font_px + "px"; rep.style.fontSize = v.font_px + "px"; }
      if (v.chip) rep.style.fontSize = "34px";
      var lines = [];
      if (v.style === "x") {
        lines.push(PC.el("span", "st-line st-x1", text)); lines.push(PC.el("span", "st-line st-x2", text));
        lines[0].id = "st-x1"; lines[1].id = "st-x2";
        lines[1].style.transformOrigin = "100% 50%";
      } else { lines.push(PC.el("span", "st-line b", text)); lines[0].id = "st-line"; }
      var tl = gsap.timeline({ paused: true });
      var quiet = { move: 0, scale: 0, rotate: 0 };
      // the group holds; the text has its own 4-frame entrance (fade and a 10 px rise, with E2's small zoom and rotation)
      var group = PCM.life(tl, wrap, { at: v.enter_at, main: { kind: "none" }, hold: v.hold, inertia: quiet, exit: { type: v.exit, at: v.exit_at } });
      PCM.life(tl, text, { at: v.enter_at, main: { kind: "fade", frames: 4, rise: 10, ease: "power2.out", zoom: "small", rotate: 8, axis: "x" }, hold: { kind: "none" }, inertia: { move: 4, scale: 0.01, rotate: 1 }, until: group.until });
      var t = Math.max(v.strike_at, v.enter_at + PC.f(4));
      if (v.style === "x") {
        // the first stroke draws from the left, the second from the right (its origin is its right end)
        PCM.grow(tl, lines[0], t, { frames: v.x_frames, axis: "x", origin: "0% 50%", ease: "power2.out", event: "strike" });
        PCM.grow(tl, lines[1], t + PC.f(v.x_gap_frames), { frames: v.x_frames, axis: "x", origin: "100% 50%", ease: "power2.out", event: "strike_second" });
        t = t + PC.f(v.x_gap_frames + v.x_frames);
      } else {
        t = PC.strike(tl, lines[0], t, { frames: v.line_frames });
      }
      PCM.dim(tl, text, t, { to: 0.55, frames: 3 });
      if (v.replacement) PCM.typeInto(tl, rep, v.replacement, t + PC.f(2), { framesPerChar: v.replace_frames_per_char });
      window.__timelines["strike-through"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "strike-through", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
