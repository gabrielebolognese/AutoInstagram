<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 90, "y": 420, "w": 900, "h": 760, "title": "claude.com/plugins", "kind": "light", "image": "assets/demo/plugin-page.png", "image_fit": "cover-top", "lines_json": "[]", "enter": "rise", "enter_at": 0, "mascot": "play", "honesty": "sourced", "scroll_px_s": 30, "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* window-card (vocabulary.md 10): shows the tool or a site: a card with a surface-chrome title bar and 3 traffic-light
       dots, the content a real screenshot (research assets) or text lines. Enters with the card move (1) or a fly-in (16),
       combined with E2's zoom and parallax rotation, then the inertia and the hold of E1 (pc-motion.js). The screenshot
       inside scrolls slowly (30 px per second by default, scroll_px_s) through its own height (object-fit cover, the
       object-position moving down): the content itself keeps moving, as in the references' window cards (E1, E8). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #wc { overflow: hidden; display: flex; flex-direction: column; }
    #wc-body { flex: 1 1 auto; min-height: 0; position: relative; background: var(--c-surface); overflow: hidden; }
    #wc.dark #wc-body { background: #1C1511; }
    #wc-img { display: none; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    #wc-img.contain { object-fit: contain; }
    #wc-lines { display: none; padding: 34px 40px; font-weight: 600; font-size: 32px; line-height: 1.35; white-space: pre-wrap; }
    #wc.dark #wc-lines { color: #F3E9E1; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 28px; }
    #wc-mascot { position: absolute; display: none; }
  </style>
  <div id="root" data-composition-id="window-card" data-width="1080" data-height="1920">
    <div id="wc" class="pc-card pc-el">
      <div id="wc-chrome" class="pc-chrome"><span class="pc-dot a"></span><span class="pc-dot b"></span><span class="pc-dot c"></span><span id="wc-title" class="pc-chrome-title"></span></div>
      <div id="wc-body"><img id="wc-img" alt=""><div id="wc-lines"></div></div>
    </div>
    <div id="wc-mascot" class="pc-mascot pc-el"></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 90, y: 420, w: 900, h: 760, title: "", kind: "light", image: "", image_fit: "cover-top", lines_json: [], enter: "rise", enter_at: 0,
        mascot: "", honesty: "none", scroll_px_s: 30, hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var wc = document.getElementById("wc"), chrome = document.getElementById("wc-chrome"), img = document.getElementById("wc-img"), lines = document.getElementById("wc-lines");
      PC.place(wc, v);
      document.getElementById("wc-title").textContent = v.title;
      if (v.kind === "dark") { wc.classList.add("dark"); chrome.classList.add("pc-chrome-dark"); }
      if (v.image) { img.src = v.image; img.style.display = "block"; if (v.image_fit === "contain") img.classList.add("contain"); }
      else { lines.style.display = "block"; lines.textContent = (Array.isArray(v.lines_json) ? v.lines_json : []).join("\n"); }
      PC.honesty(wc, v.honesty, { top: 88, right: 24 });
      var tl = gsap.timeline({ paused: true });
      var exit = { type: v.exit, at: v.exit_at };
      var main = v.enter === "fly-in" ? { kind: "fly-in", dy: 870, tilt: 2.4, frames: 16 } : v.enter === "none" ? { kind: "none" } : { kind: "rise", rise: 38 };
      var life = PCM.life(tl, wc, { at: v.enter_at, main: main, hold: v.hold, exit: exit });
      // the screenshot scrolls slowly inside the window (the page reads on: content motion, E1); object-fit cover with
      // object-position moving down, so the image box never leaves the window
      if (v.image && v.image_fit !== "contain" && v.scroll_px_s > 0) {
        PCM.scroll(tl, img, life.land, life.until - life.land, { speed: v.scroll_px_s, width: v.w, height: v.h - 72 });
      }
      if (v.mascot) {
        var m = document.getElementById("wc-mascot");
        m.innerHTML = PC.mascotSVG(v.mascot, getComputedStyle(document.documentElement).getPropertyValue("--c-mascot").trim());
        m.style.display = "block"; m.style.left = (v.x + v.w - 47) + "px"; m.style.top = (v.y - 32) + "px";
        PCM.mascotEnter(tl, m, life.land, { hold: v.hold, exit: exit, until: life.until, seed: PC.hash(v.title + v.mascot) });
      }
      window.__timelines["window-card"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "window-card", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
