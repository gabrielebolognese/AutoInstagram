<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 240, "y": 560, "w": 600, "h": 600, "object": "card", "spin": 40, "tilt": 18, "enter_at": 0.2, "enter_frames": 12, "clip_start": 0, "label": "the skill file", "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* hero-3d: the 3D hero object (tweaks.md: 3D in the hook and the end card only, at most 2 objects). Three.js draws
       from the hf-seek event's time (runtimes.md, the seek protocol): every frame is a pure function of time, and the
       object turns and bobs at every frame (E1). Low poly, one object, a warm key light and a cool rim over a
       transparent canvas, a soft contact shadow under it that breathes with the hold (pc-motion.js). Without WebGL
       (hardware ANGLE or SwiftShader, see motion-lib/webgl.json) the canvas is replaced by a flat 2D card and the mount
       reports data-webgl="0" so S10 can flag NEEDS REVIEW. Never a logo: BRAND.md allows no 3D logo. */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #h3-canvas { display: block; }
    #h3-shadow { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(133, 112, 92, 0.42) 0%, rgba(133, 112, 92, 0) 70%); }
    #h3-fallback { display: none; border-radius: 24px; background: var(--c-surface); box-shadow: 0 0 0 var(--card-edge) var(--c-card-edge), 0 31px 35px -4px rgba(133, 112, 92, 0.34); }
    #h3-fallback::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--c-accent); border-radius: 0 0 24px 24px; }
    #h3-label { position: absolute; text-align: center; font-weight: 800; font-size: 34px; }
  </style>
  <div id="root" data-composition-id="hero-3d" data-width="1080" data-height="1920">
    <div id="h3-shadow" class="pc-el"></div>
    <canvas id="h3-canvas" class="pc-el"></canvas>
    <div id="h3-fallback" class="pc-el"></div>
    <div id="h3-label" class="pc-el"></div>
  </div>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 240, y: 560, w: 600, h: 600, object: "card", spin: 40, tilt: 18, enter_at: 0, enter_frames: 12, clip_start: 0, label: "", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var root = document.getElementById("root"), canvas = document.getElementById("h3-canvas"), shadow = document.getElementById("h3-shadow");
      var fallback = document.getElementById("h3-fallback"), label = document.getElementById("h3-label");
      PC.place(canvas, v); PC.place(fallback, { x: v.x + v.w * 0.2, y: v.y + v.h * 0.15, w: v.w * 0.6, h: v.h * 0.7 });
      PC.place(shadow, { x: v.x + v.w * 0.15, y: v.y + v.h * 0.86, w: v.w * 0.7, h: v.h * 0.12 });
      if (v.label) { label.textContent = v.label; PC.place(label, { x: v.x, y: v.y + v.h + 8, w: v.w }); }
      var enterDur = PC.f(v.enter_frames);
      var tl = gsap.timeline({ paused: true });
      var exit = { type: v.exit, at: v.exit_at };
      // the contact shadow grows in with the object and breathes with the hold (a scale creep, no drift)
      var sh = PCM.life(tl, shadow, { at: v.enter_at, main: { kind: "fade", frames: v.enter_frames, rise: 0, ease: "none", zoom: 0.5, rotate: false }, hold: { level: v.hold, kind: "scale" }, inertia: { move: 0, scale: 0.02, rotate: 0 }, exit: exit, events: { enter: "shadow" } });
      if (v.label) PCM.life(tl, label, { at: v.enter_at + enterDur, main: { kind: "fade", frames: 5, rise: 0, zoom: false, rotate: false }, hold: { level: v.hold, kind: "drift" }, inertia: { move: 0, scale: 0, rotate: 0 }, exit: exit, events: { enter: "label" } });
      PC.event("enter", v.enter_at, { el: "h3-canvas", kind: "3d" }); PC.event("land", v.enter_at + enterDur, { el: "h3-canvas" });

      // the entrance scale: 0 to 1 with a small back-out, as a closed form of local time
      function enterScale(local) {
        var p = (local - v.enter_at) / enterDur;
        if (p <= 0) return 0;
        if (p >= 1) return 1;
        var s = 1.3;  // back.out
        p = p - 1;
        return 1 + (s + 1) * p * p * p + s * p * p;
      }
      var gl = null;
      try { gl = canvas.getContext("webgl2", { alpha: true, antialias: true, preserveDrawingBuffer: true }) || canvas.getContext("webgl", { alpha: true, antialias: true, preserveDrawingBuffer: true }); } catch (e) { gl = null; }
      if (!gl || typeof THREE === "undefined") {
        root.setAttribute("data-webgl", "0");
        window.__pcWebGL = false;
        canvas.style.display = "none"; fallback.style.display = "block";
        PCM.life(tl, fallback, { at: v.enter_at, main: { kind: "pop", frames: v.enter_frames, overshoot: 0.1, from: 0.5 }, hold: v.hold, exit: exit, events: { enter: "fallback" } });
        if (window.console) console.warn("[paper-cards] hero-3d: WebGL unavailable, 2D fallback shown");
      } else {
        root.setAttribute("data-webgl", "1");
        window.__pcWebGL = true;
        var renderer = new THREE.WebGLRenderer({ canvas: canvas, context: gl, alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(v.w, v.h, false);
        renderer.setClearColor(0x000000, 0);
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(32, v.w / v.h, 0.1, 50);
        camera.position.set(0, 0.35, 6.2); camera.lookAt(0, 0, 0);
        scene.add(new THREE.HemisphereLight(0xfff3e6, 0xe8d5c4, 2.4));
        var key = new THREE.DirectionalLight(0xffe2c8, 3.2); key.position.set(-3, 4, 5); scene.add(key);
        var rim = new THREE.DirectionalLight(0xd4d9db, 1.4); rim.position.set(4, 2, -4); scene.add(rim);
        var surface = new THREE.MeshStandardMaterial({ color: 0xfffaf7, roughness: 0.55, metalness: 0.0 });
        var accent = new THREE.MeshStandardMaterial({ color: 0xdc6532, roughness: 0.5, metalness: 0.0 });
        var group = new THREE.Group(); scene.add(group);
        if (v.object === "icosa") {
          group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 0), accent));
        } else if (v.object === "box") {
          group.add(new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.9, 1.9), surface));
          var edge = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.18, 2.0), accent); edge.position.y = -1.0; group.add(edge);
        } else {
          var card = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.9, 0.12), surface); group.add(card);
          var stripe = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.26, 0.13), accent); stripe.position.y = -1.32; group.add(stripe);
          var line1 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.14, 0.02), new THREE.MeshStandardMaterial({ color: 0x1c110f, roughness: 0.8 })); line1.position.set(-0.2, 0.7, 0.07); group.add(line1);
          var line2 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.14, 0.02), new THREE.MeshStandardMaterial({ color: 0x1c110f, roughness: 0.8 })); line2.position.set(-0.45, 0.3, 0.07); group.add(line2);
        }
        group.rotation.x = v.tilt * Math.PI / 180;
        function renderAt(rootTime) {
          var local = rootTime - v.clip_start;
          var s = enterScale(local);
          group.scale.set(s, s, s);
          var tt = Math.max(0, local - v.enter_at);
          group.rotation.y = (v.spin * Math.PI / 180) * tt * 0.6 + Math.sin(tt * 1.3) * 0.25;
          group.position.y = Math.sin(tt * 2.0) * 0.06;
          renderer.render(scene, camera);
        }
        window.addEventListener("hf-seek", function (e) { renderAt(e && e.detail && typeof e.detail.time === "number" ? e.detail.time : 0); });
        window.__pcRenderAt = renderAt;
        renderAt(v.clip_start);
      }
      PCM.exit(tl, canvas, v.exit_at, v.exit, { el: "h3-canvas" });
      window.__timelines["hero-3d"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "hero-3d", duration = 4;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
