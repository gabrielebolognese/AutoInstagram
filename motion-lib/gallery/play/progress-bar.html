<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 120, "y": 860, "w": 840, "label": "Installing frontend-design", "value": 100, "in_card": true, "fill_frames": 6, "check": true, "check_frames": 3, "enter_at": 0, "fill_at": 0.5, "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* progress-bar (vocabulary.md 18, Progress or meter bar): something finishing or a usage value. The bar fills over
       6 frames, then a check badge pops over 3 frames (v01 0:33.4). The card lives through E1's phases with E2's
       combined entrance (pc-motion.js); the percent counts through a setter. */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #pb { padding: 30px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; }
    #pb.bare { padding: 0; background: none; box-shadow: none; }
    #pb-row { display: flex; align-items: center; gap: 20px; }
    #pb-label { font-weight: 700; font-size: 30px; flex: 1 1 auto; }
    #pb-track { height: 26px; border-radius: 999px; background: var(--c-surface-chrome); box-shadow: inset 0 0 0 1px var(--c-card-edge); overflow: hidden; }
    #pb-fill { height: 100%; width: 100%; border-radius: 999px; background: var(--c-accent); transform-origin: 0% 50%; }
    #pb-check { width: 64px; height: 64px; border-width: 5px; flex: 0 0 auto; }
    #pb-check svg { width: 34px; height: 34px; }
    #pb-pct { font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
  </style>
  <div id="root" data-composition-id="progress-bar" data-width="1080" data-height="1920">
    <div id="pb" class="pc-card pc-el">
      <div id="pb-row"><span id="pb-label"></span><span id="pb-pct">0%</span><span id="pb-check" class="pc-check-badge"></span></div>
      <div id="pb-track"><div id="pb-fill"></div></div>
    </div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 120, y: 860, w: 840, label: "", value: 100, in_card: true, fill_frames: 6, check: true, check_frames: 3, enter_at: 0, fill_at: 0.5, hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var pb = document.getElementById("pb"), fill = document.getElementById("pb-fill"), check = document.getElementById("pb-check"), pct = document.getElementById("pb-pct");
      PC.place(pb, { x: v.x, y: v.y, w: v.w });
      if (!v.in_card) pb.classList.add("bare");
      document.getElementById("pb-label").textContent = v.label;
      check.innerHTML = PC.checkSVG();
      var tl = gsap.timeline({ paused: true });
      var life = PCM.life(tl, pb, { at: v.enter_at, main: { kind: "rise", rise: 38 }, hold: v.hold, exit: { type: v.exit, at: v.exit_at } });
      var at = Math.max(life.land, v.fill_at);
      var target = Math.max(0, Math.min(100, v.value)) / 100;
      PCM.grow(tl, fill, at, { frames: v.fill_frames, axis: "x", to: target, ease: "power2.out", event: "fill" });
      PCM.countUp(tl, pct, at, { to: v.value, frames: v.fill_frames, suffix: "%", ease: "power2.out" });
      if (v.check && target >= 0.999) {
        var cAt = at + PC.f(v.fill_frames) - PC.f(1);
        PCM.life(tl, check, { at: cAt, main: { kind: "pop", overshoot: 0.16, frames: v.check_frames, from: 0.3, rotate: 8 }, hold: { kind: "none" }, inertia: { move: 0, scale: 0.01, rotate: 1 }, until: life.until, events: { enter: "check", land: "check_peak" } });
      } else gsap.set(check, { opacity: 0 });
      window.__timelines["progress-bar"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "progress-bar", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
