<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 366, "y": 700, "size": 160, "shape": "tile", "image": "assets/brand/mark/mark-gradient.png", "image_pad": 30, "second_image": "assets/brand/mark/mark-black.png", "overshoot": 0.13, "frames": 14, "enter_at": 0.2, "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* logo-tile (vocabulary.md 14, Logo tile or logo badge): names the tool or brand. A surface rounded square (v02) or
       circle badge (v01) holding the logo as an image file with its aspect ratio locked (BRAND.md: never redrawn,
       recolored or stretched; the tile keeps the style's shadow, the logo gets none). Pops with 13 percent overshoot
       over 14 frames (v08); a second tile slides in from the left over 9 frames with a 6 px overshoot (v08). With no
       image the tile shows the style's neutral icon in accent. Both tiles live through E1's phases (pc-motion.js); the
       tile turns, never the logo inside it (the logo keeps its drawn shape: tweaks.md Branding). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    .lt { position: absolute; box-sizing: border-box; }
    .lt img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .lt svg { width: 56%; height: 56%; }
  </style>
  <div id="root" data-composition-id="logo-tile" data-width="1080" data-height="1920">
    <div id="lt-main" class="lt pc-el"></div>
    <div id="lt-second" class="lt pc-el" style="display: none"></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 460, y: 700, size: 160, shape: "tile", image: "", image_pad: 30, second_image: "", overshoot: 0.13, frames: 14, enter_at: 0, hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var neutral = '<svg viewBox="0 0 24 24" fill="none" stroke="#DC6532" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8M12 8v8"/></svg>';
      function fill(el, image) {
        el.className = "lt pc-el " + (v.shape === "badge" ? "pc-logo-badge" : "pc-logo-tile");
        el.style.width = v.size + "px"; el.style.height = v.size + "px"; el.style.padding = v.image_pad + "px";
        if (image) { var img = document.createElement("img"); img.src = image; img.alt = ""; img.className = "pc-logo"; el.appendChild(img); }
        else el.innerHTML = neutral;
      }
      var main = document.getElementById("lt-main"), second = document.getElementById("lt-second");
      fill(main, v.image); PC.place(main, { x: v.x, y: v.y });
      var tl = gsap.timeline({ paused: true });
      var exit = { type: v.exit, at: v.exit_at };
      // a logo keeps its drawn shape: the tile turns only a little (a 6 degree parallax, not the full 12)
      PCM.life(tl, main, { at: v.enter_at, main: { kind: "pop", overshoot: v.overshoot, frames: v.frames, from: 0.55, rotate: 6 }, hold: v.hold, exit: exit });
      if (v.second_image) {
        second.style.display = "flex"; fill(second, v.second_image);
        PC.place(second, { x: v.x + v.size + 28, y: v.y });
        var at = v.enter_at + PC.f(v.frames) + PC.f(3);
        PCM.life(tl, second, { at: at, main: { kind: "slide", dx: -(v.size + 28), frames: 9, overshoot: 6, rotate: 6, rotateSign: -1 }, hold: v.hold, exit: exit });
      }
      window.__timelines["logo-tile"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "logo-tile", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
