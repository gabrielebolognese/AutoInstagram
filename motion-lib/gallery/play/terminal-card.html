<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 90, "y": 560, "w": 900, "h": 0, "title": "terminal", "lines_json": "[{\"text\":\"/plugin install frontend-design@claude-plugins-official\",\"color\":\"accent\"},{\"text\":\"Installing frontend-design...\",\"color\":\"muted\"},{\"text\":\"Installed. Scope: user\",\"color\":\"success\"}]", "mode": "type", "chars_per_frame": 2, "line_gap_frames": 6, "start_delay_frames": 8, "prompt": "$ ", "font_px": 30, "enter_at": 0, "honesty": "none", "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];

<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* terminal-card (vocabulary.md 11, Terminal or code card that types): shows the prompt or the code being written: a
       dark window card with colored mono text; lines appear one by one, a rewrite types 1.7 to 2.6 characters per
       frame (v04), here 2 per frame. The typing segment is a sound event (typing, trimmed to its length). The card lives
       through E1's phases with E2's combined entrance; the typing is a tween on a setter (pc-motion.js). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #tc { overflow: hidden; display: flex; flex-direction: column; }
    #tc-body { padding: 30px 40px 36px; font-family: "JetBrains Mono", monospace; font-weight: 500; line-height: 1.45; color: #F3E9E1; min-height: 160px; }
    .tc-line { white-space: pre-wrap; word-break: break-all; min-height: 1.45em; }
    .tc-line.accent { color: #F2A07B; } .tc-line.success { color: #7DD39A; } .tc-line.muted { color: #B9ABA1; } .tc-line.paper { color: #F3E9E1; }
    .tc-caret { display: inline-block; width: 0.55em; height: 1.1em; background: #F2A07B; vertical-align: -0.15em; margin-left: 2px; }
  </style>
  <div id="root" data-composition-id="terminal-card" data-width="1080" data-height="1920">
    <div id="tc" class="pc-card-dark pc-el">
      <div class="pc-chrome pc-chrome-dark"><span class="pc-dot a"></span><span class="pc-dot b"></span><span class="pc-dot c"></span><span id="tc-title" class="pc-chrome-title"></span></div>
      <div id="tc-body"></div>
    </div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 90, y: 560, w: 900, h: 0, title: "terminal", lines_json: [], mode: "type", chars_per_frame: 2, line_gap_frames: 6, start_delay_frames: 8,
        prompt: "$ ", font_px: 30, enter_at: 0, honesty: "none", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var tc = document.getElementById("tc"), body = document.getElementById("tc-body");
      PC.place(tc, v);
      document.getElementById("tc-title").textContent = v.title;
      body.style.fontSize = v.font_px + "px";
      PC.honesty(tc, v.honesty, { top: 88, right: 24 });
      var lines = (Array.isArray(v.lines_json) ? v.lines_json : []).map(function (l, i) {
        var el = PC.el("div", "tc-line " + (l.color || "paper"), body); el.id = "tc-line-" + i;
        return { el: el, text: (i === 0 && v.prompt ? v.prompt : "") + (l.text || "") };
      });
      var tl = gsap.timeline({ paused: true });
      var life = PCM.life(tl, tc, { at: v.enter_at, main: { kind: "rise", rise: 38 }, hold: v.hold, exit: { type: v.exit, at: v.exit_at } });
      var t = life.land + PC.f(v.start_delay_frames);
      var quiet = { move: 0, scale: 0, rotate: 0 };
      lines.forEach(function (l, i) {
        if (v.mode === "type") {
          var end = PCM.typeInto(tl, l.el, l.text, t, { framesPerChar: 1 / Math.max(0.25, v.chars_per_frame) });
          t = end + PC.f(v.line_gap_frames);
        } else {
          tl.set(l.el, { textContent: l.text }, t);
          PCM.life(tl, l.el, { at: t, main: { kind: "fade", frames: 2, rise: 0, zoom: false, rotate: false }, hold: { kind: "none" }, inertia: quiet, until: t + PC.f(1), events: { enter: "line" } });
          t += PC.f(v.line_gap_frames);
        }
      });
      lines.forEach(function (l) { if (v.mode !== "type") l.el.textContent = ""; });
      window.__timelines["terminal-card"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "terminal-card", duration = 4;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
