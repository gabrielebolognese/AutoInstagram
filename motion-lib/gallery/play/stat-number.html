<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="file:///C:/Users/there/OneDrive/Desktop/instagramReels/motion-lib/">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F5EEE3; } #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }</style>
<script src="assets/vendor/gsap.min.js"></script>
<script>window.__timelines = {}; window.__hfVars = {"x": 120, "y": 700, "value": 1134112, "decimals": 0, "prefix": "", "suffix": "", "unit": "installs", "container": "pill", "icon": "download", "sub_label": "", "enter_at": 0, "count_frames": 27.5, "count_delay_frames": 0, "honesty": "none", "hold": "normal", "exit": "none", "exit_at": -1};
window.__hyperframes = { getVariables: function () { return Object.assign({}, window.__hfVars); } };
window.__pcEvents = [];
</script>
</head>
<body>
<div id="stage">

  
  <style>
    /* paper-canvas: the background of every reel (style.md Canvas): paper, a warm glow top left, a warm glow lower
       right (open question 8: v02), darker bottom corners, a dot grid. From M14 it carries life (Motion and energy
       rules E5 and E7): the edge filler layer (soft cards, chips, thumbnails, shapes and stars 30 to 70 percent outside
       the left and right borders, behind the content, quieter than it, at most 20 px per second, no text) and the
       ambient layer (stars, dots and small clouds in the palette, a slow drift and twinkle), both seeded per reel and
       kept out of every text zone (tokens.json motion.grammar.text_zones). Mounted for the whole reel at z 0. */
    #paper-root { position: absolute; inset: 0; overflow: hidden; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #paper-base { position: absolute; inset: 0; background: var(--c-paper); }
    #paper-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 820px 980px at 0px 0px, var(--c-glow-warm) 0%, rgba(236, 210, 190, 0.6) 42%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 760px 900px at 1080px 1560px, var(--c-glow-lower) 0%, rgba(240, 217, 199, 0.5) 45%, rgba(245, 238, 227, 0) 100%),
        radial-gradient(ellipse 420px 300px at 0px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%),
        radial-gradient(ellipse 420px 300px at 1080px 1920px, var(--c-corner) 0%, rgba(228, 215, 201, 0) 100%);
    }
    #paper-dots {
      position: absolute; inset: 0; opacity: 0.85;
      background-image: radial-gradient(circle, var(--c-dot) calc(var(--dot-size) / 2), rgba(0, 0, 0, 0) calc(var(--dot-size) / 2 + 0.6px));
      background-size: var(--dot-spacing) var(--dot-spacing);
      background-position: calc(var(--dot-spacing) / 2) calc(var(--dot-spacing) / 2);
    }
  </style>
  <div id="paper-root" data-composition-id="paper-canvas" data-width="1080" data-height="1920">
    <div id="paper-base"></div>
    <div id="paper-glow"></div>
    <div id="paper-dots"></div>
  </div>
  
  
  
<link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* stat-number (vocabulary.md 2, Stat number with count-up): a number that proves the point, counting from 0 with
       ease-out over 27.5 frames after its container entered (1). Containers: the white pill (168 tall, icon, number,
       unit in accent; v01) or the chip (141 tall, number plus serif-italic unit, a sub-label pill under it; v02). The
       container lives through E1's phases with E2's combined entrance (pc-motion.js); the count is a tween on a
       setter, so it renders under HyperFrames' suppressed events. */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #stat-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
    #stat { display: inline-flex; align-items: center; gap: 22px; padding: 0 46px; white-space: nowrap; }
    #stat.pill { height: var(--stat-pill-h); border-radius: 999px; }
    #stat.chip { height: var(--stat-chip-h); border-radius: 40px; }
    #stat-icon { display: none; width: 64px; height: 64px; }
    #stat-icon svg { width: 100%; height: 100%; display: block; }
    #stat-unit.pill { color: var(--c-accent); font-weight: 800; font-size: 44px; }
    #stat-unit.chip { color: var(--c-unit-serif); font-size: 60px; }
    #stat-sub { display: none; height: 56px; font-size: 28px; padding: 0 22px; margin-left: 30px; }
  </style>
  <div id="root" data-composition-id="stat-number" data-width="1080" data-height="1920">
    <div id="stat-wrap" class="pc-el">
      <div id="stat" class="pc-card">
        <span id="stat-icon"></span>
        <span id="stat-num" class="pc-stat">0</span>
        <span id="stat-unit" class="pc-serif"></span>
      </div>
      <div id="stat-sub" class="pc-light-chip"></div>
    </div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ x: 120, y: 700, value: 1134112, decimals: 0, prefix: "", suffix: "", unit: "installs", container: "pill", icon: "none",
        sub_label: "", enter_at: 0, count_frames: 27.5, count_delay_frames: 0, honesty: "none", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var wrap = document.getElementById("stat-wrap"), stat = document.getElementById("stat"), num = document.getElementById("stat-num");
      var unit = document.getElementById("stat-unit");
      PC.place(wrap, { x: v.x, y: v.y });
      stat.classList.add(v.container);
      unit.classList.add(v.container);
      if (v.container === "pill") unit.classList.remove("pc-serif");
      unit.textContent = v.unit;
      var icons = {
        download: '<svg viewBox="0 0 24 24" fill="none" stroke="#DC6532" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>',
        star: '<svg viewBox="0 0 24 24" fill="#DC6532"><path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.5 5.9 21l1.5-6.8L2.2 9.5l6.9-.7z"/></svg>',
        comment: '<svg viewBox="0 0 24 24" fill="none" stroke="#DC6532" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
        play: '<svg viewBox="0 0 24 24" fill="#DC6532"><path d="M7 4l12 8-12 8z"/></svg>'
      };
      if (v.container === "pill" && icons[v.icon]) { var ic = document.getElementById("stat-icon"); ic.innerHTML = icons[v.icon]; ic.style.display = "inline-block"; }
      if (v.container === "chip" && v.sub_label) { var sub = document.getElementById("stat-sub"); sub.textContent = v.sub_label; sub.style.display = "inline-flex"; }
      PC.honesty(stat, v.honesty, { top: -22, right: 24 });

      var tl = gsap.timeline({ paused: true });
      var life = PCM.life(tl, wrap, { at: v.enter_at, main: { kind: "rise", rise: 38 }, hold: v.hold, exit: { type: v.exit, at: v.exit_at } });
      PCM.countUp(tl, num, life.land + PC.f(v.count_delay_frames), { to: v.value, frames: v.count_frames, decimals: v.decimals, prefix: v.prefix, suffix: v.suffix });
      window.__timelines["stat-number"] = tl;
      tl.seek(0);
    })();
  </script>
</div>

<script>
(function () {
  var id = "stat-number", duration = 3;
  var tl = window.__timelines[id];
  var start = performance.now();
  function tick() {
    var t = ((performance.now() - start) / 1000) % duration;
    if (tl) tl.seek(t, false);
    try { window.dispatchEvent(new CustomEvent("hf-seek", { detail: { time: t, waitUntil: function () {} } })); } catch (e) {}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
