<html data-composition-variables='[
  {"id":"kind","type":"enum","label":"Pull-back into a window, or zoom into one card","default":"pullback","options":[{"value":"pullback","label":"pull-back"},{"value":"zoom","label":"zoom in"}]},
  {"id":"image","type":"string","label":"The scene content as an image (assets/...); empty = a placeholder card","default":""},
  {"id":"title","type":"string","label":"Title bar of the app window the scene shrinks into","default":"FlashFX editor"},
  {"id":"frames","type":"number","label":"Move frames (8 pull-back ease-out, v02; 20 zoom ease-in-out, v05)","default":8},
  {"id":"at","type":"number","label":"Move starts (s)","default":0.6},
  {"id":"x","type":"number","label":"End window left (px)","default":150},
  {"id":"y","type":"number","label":"End window top (px)","default":520},
  {"id":"w","type":"number","label":"End window width (px)","default":780},
  {"id":"h","type":"number","label":"End window height (px)","default":880},
  {"id":"honesty","type":"enum","label":"Honesty label","default":"mock","options":[{"value":"none","label":"none"},{"value":"mock","label":"mock"},{"value":"sourced","label":"sourced"}]},
  {"id":"hold","type":"enum","label":"Hold level (the steady motion after the move)","default":"normal","options":[{"value":"calm","label":"calm"},{"value":"normal","label":"normal"},{"value":"lively","label":"lively"}]},
  {"id":"exit","type":"enum","label":"Exit","default":"none","options":[{"value":"none","label":"none"},{"value":"fade-blur","label":"fade-blur"},{"value":"fall","label":"fall"},{"value":"push","label":"push"},{"value":"cut","label":"cut"}]},
  {"id":"exit_at","type":"number","label":"Exit at (s, -1 = never)","default":-1}
]'>
<template>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/paper-cards.css">
  <style>
    /* camera-move (vocabulary.md 19, Camera pull-back or zoom): reveals context (the reel inside an editor) or dives
       into one card. Pull-back of the whole scene into an app window, 8 frames ease-out (v02 f828 to f835); the zoom
       goes the other way, 20 frames ease-in-out (v05). The caption layer is a separate component and does not move.
       Before and after the move the scene keeps a slow drift (E1); the camera move itself is PCM.camera (pc-motion.js). */
    #root { position: absolute; inset: 0; font-family: "Inter Tight", sans-serif; color: var(--c-ink); }
    #cm-stage { left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
    #cm-content { position: absolute; inset: 0; background: var(--c-surface); overflow: hidden; }
    #cm-content img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    #cm-ph { position: absolute; inset: 0; background: linear-gradient(170deg, #F6EBE2, #E9D6C6); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 64px; color: var(--c-accent-deep); }
    #cm-window { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; border-radius: var(--card-radius); box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #1C1511; opacity: 0; }
    #cm-window .pc-chrome { flex: 0 0 auto; }
    #cm-window-body { flex: 1 1 auto; }
  </style>
  <div id="root" data-composition-id="camera-move" data-width="1080" data-height="1920">
    <div id="cm-window" class="pc-el pc-card-dark">
      <div class="pc-chrome pc-chrome-dark"><span class="pc-dot a"></span><span class="pc-dot b"></span><span class="pc-dot c"></span><span id="cm-title" class="pc-chrome-title"></span></div>
      <div id="cm-window-body"></div>
    </div>
    <div id="cm-stage" class="pc-el"><div id="cm-content"><img id="cm-img" alt="" style="display:none"><div id="cm-ph">the scene</div></div></div>
  </div>
  <script src="assets/paper-cards.js"></script>
  <script src="assets/pc-motion.js"></script>
  <script>
    (function () {
      var v = PC.vars({ kind: "pullback", image: "", title: "FlashFX editor", frames: 8, at: 0.6, x: 150, y: 520, w: 780, h: 880, honesty: "mock", hold: "normal", exit: "none", exit_at: -1 }, window.__hyperframes.getVariables());
      var stage = document.getElementById("cm-stage"), win = document.getElementById("cm-window");
      document.getElementById("cm-title").textContent = v.title;
      if (v.image) { var img = document.getElementById("cm-img"); img.src = v.image; img.style.display = "block"; document.getElementById("cm-ph").style.display = "none"; }
      PC.honesty(stage, v.honesty, { top: 24, right: 24 });
      // the window frame sits around the end position of the content; the content ends inside it under the chrome
      var chromeH = 72;
      PC.place(win, { x: v.x, y: v.y - chromeH, w: v.w, h: v.h + chromeH });
      var sx = v.w / 1080, sy = v.h / 1920, s = Math.min(sx, sy);
      var endX = v.x + v.w / 2 - 540, endY = v.y + v.h / 2 - 960;
      var tl = gsap.timeline({ paused: true });
      var exit = { type: v.exit, at: v.exit_at };
      // before the camera moves, the scene content drifts inside the stage (E1: nothing waits still)
      if (v.at > 0) PCM.life(tl, document.getElementById("cm-content"), { at: 0, main: { kind: "none" }, hold: { level: v.hold, kind: "drift", dir: { x: 0, y: -1 } }, inertia: { move: 0, scale: 0, rotate: 0 }, until: v.at + PC.f(v.frames) });
      var cam = PCM.camera(tl, stage, v.at, { kind: v.kind, frames: v.frames, scale: s, x: endX, y: endY, hold: v.hold, exit: exit });
      if (v.kind === "zoom") {
        tl.set(win, { opacity: 1 }, 0);
        PCM.exit(tl, win, v.at + PC.f(v.frames) - PC.f(3), "fade", { frames: 3 });
      } else {
        PCM.life(tl, win, { at: v.at + PC.f(2), main: { kind: "fade", frames: 3, rise: 0, zoom: false, rotate: false }, hold: { level: v.hold, kind: "drift-rotate", dir: cam.dir }, inertia: { move: 0, scale: 0, rotate: 0 }, until: cam.until, exit: exit, events: { enter: "window" } });
      }
      window.__timelines["camera-move"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
</html>
